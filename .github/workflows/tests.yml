name: Archive tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  driver-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compile the driver (unsigned)
        shell: pwsh
        run: |
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $sdk = Get-ChildItem $kitRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'km\ntddk.h') } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows Driver Kit not available on runner' }
          msbuild driver\ZebraUsbTap.sln /t:Build /p:Configuration=Debug /p:Platform=x64 /p:WindowsTargetPlatformVersion=$($sdk.Name) /p:SignMode=Off /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
